server {
    # 80 for local Docker usage (`-p 8080:80`) and 3000 for the existing ECS
    # service/target group, which was created for the previous Next.js image.
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router uses the History API, so deep links must serve
    # index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uncomment and replace the API origin before going live.
    # The Next.js proxy emitted this header; static hosts must emit it too.
    #
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://github.githubassets.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' blob: data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://codecoliseum.in https://github.com https://api.github.com; frame-src 'self' https://github.com; worker-src 'self' blob:;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
