name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.setup.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - ".github/workflows/frontend.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.setup.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "Dockerfile"
      - "nginx.conf"
  workflow_dispatch:

permissions:
  contents: read

# Vite inlines VITE_* variables at build time. Override these with repository
# variables (`Settings -> Secrets and variables -> Actions -> Variables`) when
# the deployment origin changes.
env:
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://codecoliseum.in/api' }}
  VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://codecoliseum.in/api/auth' }}
  VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://codecoliseum.in' }}

  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_APP }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE_FRONTEND }}

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy Frontend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: Github-actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION || 'ap-south-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_AUTH_URL="$VITE_AUTH_URL" \
            --build-arg VITE_APP_URL="$VITE_APP_URL" \
            -t "$ECR_REPOSITORY" .

      - name: Tag Docker image
        run: |
          docker tag "$ECR_REPOSITORY:latest" \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest"

      - name: Push Docker image
        run: |
          docker push \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
